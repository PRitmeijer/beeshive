services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URI=file:/app/data/database.db
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-change-me-in-production}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - db-data:/app/data
      - media-uploads:/app/media
    restart: unless-stopped

volumes:
  db-data:
  media-uploads:
