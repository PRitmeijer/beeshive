services:
  # Named for what it is rather than the generic "web": on a host running
  # several stacks the container name is what you type into `docker logs` and
  # what a future shared proxy network would resolve, and two stacks both
  # answering to "web" is a coin toss over which one you get.
  beeshive:
    container_name: beeshive
    build:
      context: .
      args:
        # Baked into the client bundle; see the Dockerfile for why.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://debeeshive.nl}
        # A database for the *build* to prerender against, and empty by
        # default. Deliberately not the runtime DATABASE_URI a few lines down:
        # that one names the `postgres` service on this stack's internal
        # network, which the build container is not on and cannot reach. If
        # this were the same variable, every build would spend a minute failing
        # to connect and then bake the fallback content in as though nothing
        # had happened, which is exactly the silence we are trying to end.
        #
        # Setting it means finding a route from the build to a cluster holding
        # the real content — a CI service container, a restored copy, the
        # production cluster with its port temporarily reachable. On this host
        # there is no such route by design, so it stays empty and
        # ops/warm-up.sh is what makes the deployment honest instead. DEPLOY.md
        # says which one is in play and why.
        DATABASE_URI: ${BUILD_DATABASE_URI:-}
    # Published on the host. Nginx Proxy Manager runs outside this stack and
    # reaches the site over the network by the host's own name, so the port
    # has to be open on the host — an unpublished container is invisible to
    # it however the Proxy Host is written.
    #
    # In Nginx Proxy Manager, the Proxy Host forwards to:
    #     hostname  beeshive     <- the host machine, not the container
    #     port      3100
    #
    # 3000 is taken on this host. The same number on both sides of the colon,
    # from one variable, so the published port and the port the app is actually
    # listening on cannot drift apart — the app's own PORT is set from it too,
    # below. Change HOST_PORT and the Proxy Host's Forward Port together.
    ports:
      - "${HOST_PORT:-3100}:${HOST_PORT:-3100}"
    # Also joined to the proxy's own network, so NPM can reach the container by
    # name whether or not it can reach this host's published port. Whichever
    # route NPM uses, the port is 3100 now — beeshive:3100, or <host>:3100.
    # `internal` is this stack's own network and is where Postgres lives; the
    # database is deliberately not reachable from the proxy network or the host.
    networks:
      - reverse-proxy
      - internal
    # Payload applies outstanding migrations the moment it connects, so an app
    # that starts before Postgres is accepting connections does not merely
    # retry — it can fail its first request and serve the defaults from
    # src/lib/payload.ts while looking perfectly healthy. Wait for the
    # healthcheck rather than for the container to exist.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # What the Next server binds to inside the container. Kept equal to the
      # published port above; the Dockerfile's 3000 is the standalone default
      # for a plain `docker run`, and this overrides it.
      - PORT=${HOST_PORT:-3100}
      # The start-up check in ops/preflight.mjs, which refuses to start the
      # server when this database still carries the dev-push marker that makes
      # Payload stop on a prompt nothing in a container can answer. On by
      # default, and it is the one thing here allowed to keep the container
      # down: without it that fault produces a container compose calls healthy,
      # serving the pages built into the image and taking no bookings.
      # PREFLIGHT=off in .env turns it off.
      - PREFLIGHT=${PREFLIGHT:-on}
      # The start-up warm-up in ops/warm-up.sh, which asks the site for every
      # public page once so that Next regenerates it against this database
      # rather than serving what the image was built with. On by default;
      # WARMUP=off in .env turns it off, which is only ever right while you are
      # deliberately looking at the prerendered output.
      - WARMUP=${WARMUP:-on}
      # The database lives in the `postgres` service on this stack's own
      # network, so the host name is the service name and the port is the
      # container's 5432 whatever the host has published.
      - DATABASE_URI=postgresql://${POSTGRES_USER:-beeshive}:${POSTGRES_PASSWORD:-beeshive}@postgres:5432/${POSTGRES_DB:-beeshive}
      # Still pinned to the mounted volume, and still absolute: Payload
      # resolves a relative staticDir against the working directory, which from
      # /app pointed at the image's own root-level /media. This is only used
      # when R2 is not configured — with a bucket the container writes no files
      # at all — but it costs nothing to keep the volume mounted for the day
      # somebody takes the bucket away again.
      - MEDIA_DIR=/app/media
      # No default on purpose. A committed fallback is a signing key anyone
      # who can read this repository could forge sessions with, so an unset
      # secret has to stop the container rather than quietly weaken it.
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://debeeshive.nl}
      # Cloudflare R2. All four have to be set before uploads leave the
      # container; with any of them missing the site writes to /app/media as it
      # always did, which is why they are safe to leave blank on a test host.
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      # Read-only key for the visitor statistics shown in the admin. Unset
      # simply means no statistics.
      - UMAMI_API_KEY=${UMAMI_API_KEY:-}
      # The Umami sign-in the admin panel reads the figures back with. A
      # self-hosted Umami issues no API keys at all, only a bearer token from
      # its login endpoint, and that token expires, so an install that is meant
      # to keep showing figures without anyone pasting a new one in every so
      # often has to be able to log in for itself. Named here as well as in
      # .env.example because nothing else carries them into the container, and
      # a value set in .env alone would silently do nothing. Unset simply means
      # no statistics in the admin; nothing on the public site depends on them.
      - UMAMI_USERNAME=${UMAMI_USERNAME:-}
      - UMAMI_PASSWORD=${UMAMI_PASSWORD:-}
      # How many proxies of our own stand in front of this container, which is
      # how far in from the right of x-forwarded-for the rate limiter finds the
      # visitor. One — Nginx Proxy Manager — is the default and is right for
      # this stack; put Cloudflare in front of NPM and it becomes 2. Named here
      # as well as in .env.example because nothing else forwards it into the
      # container, and a value set in .env alone would silently do nothing.
      # See docs/rate-limiting.md.
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
      # Outgoing mail: reservation requests and contact messages. Leave these
      # blank and Payload writes mail to the container log instead of sending
      # it — the site will take bookings that nobody is told about.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - EMAIL_FROM=${EMAIL_FROM:-info@debeeshive.nl}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-De Bee's Hive}
    volumes:
      - media-uploads:/app/media
    restart: unless-stopped

  # The database. Built from ops/postgres rather than pulled straight from the
  # registry for one reason: `archive_command` runs inside *this* container, so
  # the pgbackrest binary has to be in *this* image. A stock postgres:16-alpine
  # would log "pgbackrest: not found" once per WAL segment and quietly stop
  # archiving anything (see ops/postgres/postgresql.conf).
  postgres:
    container_name: beeshive-postgres
    build:
      context: ./ops/postgres
    # Not optional, and the reason is worth the paragraph.
    #
    # `archive-async=y` means pgbackrest's archive-push forks a worker and
    # returns immediately, and that worker double-forks to detach itself. On a
    # normal host it is then re-parented to init. In a container it is
    # re-parented to PID 1 — which here is the Postgres postmaster. The
    # postmaster reaps a child it has no record of, decides one of its backends
    # has crashed, and restarts the whole cluster:
    #
    #     LOG:  server process (PID 106) exited with exit code 103
    #     LOG:  terminating any other active server processes
    #
    # On a fresh deploy that is a deadlock rather than a hiccup. Archiving
    # fails until the stanza exists, the crash cycle keeps the cluster in
    # recovery, and `stanza-create` cannot run against a cluster in recovery —
    # so the database never comes up at all. `init: true` puts docker-init at
    # PID 1, the orphan is re-parented there instead, and the same fresh start
    # produces a handful of "archive command failed" lines that clear the
    # moment the stanza is created.
    init: true
    networks:
      - internal
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-beeshive}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beeshive}
      - POSTGRES_DB=${POSTGRES_DB:-beeshive}
      # Passed through to the pgbackrest that archive_command invokes. The
      # bucket credentials and the encryption passphrase are environment-only:
      # ops/pgbackrest/pgbackrest.conf is in the repository and must not carry
      # them. pgbackrest reads PGBACKREST_<OPTION> for every option it has, and
      # the environment wins over the file.
      - PGBACKREST_REPO1_S3_BUCKET=${PGBACKREST_S3_BUCKET:-}
      - PGBACKREST_REPO1_S3_ENDPOINT=${PGBACKREST_S3_ENDPOINT:-}
      - PGBACKREST_REPO1_S3_KEY=${PGBACKREST_S3_KEY:-}
      - PGBACKREST_REPO1_S3_KEY_SECRET=${PGBACKREST_S3_KEY_SECRET:-}
      - PGBACKREST_REPO1_CIPHER_PASS=${PGBACKREST_CIPHER_PASS:-}
      # initdb creates exactly one role, named by POSTGRES_USER, and pgbackrest
      # would otherwise connect as the OS user `postgres`, which this cluster
      # does not have. See the note in ops/pgbackrest/pgbackrest.conf.
      - PGBACKREST_PG1_USER=${POSTGRES_USER:-beeshive}
      # Read by ops/postgres/initdb/10-umami-database.sh, which is what creates
      # Umami's database on a cluster being initialised for the first time. The
      # same variable names the database in the umami service's DATABASE_URL
      # further down, and the two have to be the same one: set it on one side
      # only and you get an empty database next to an Umami that cannot find it.
      - UMAMI_DB=${UMAMI_DB:-umami}
    # The image's own postgresql.conf is generated by initdb and knows nothing
    # about WAL archiving, so the server is started against ours instead. The
    # other three paths have to be named explicitly: naming a config file
    # outside the data directory makes Postgres forget where the data directory
    # and the auth files are, and it will not start without being told.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - data_directory=/var/lib/postgresql/data
      - -c
      - hba_file=/var/lib/postgresql/data/pg_hba.conf
      - -c
      - ident_file=/var/lib/postgresql/data/pg_ident.conf
    volumes:
      - pg-data:/var/lib/postgresql/data
      # The Unix socket directory, shared with the backup container so that
      # pgbackrest can talk to a running server without opening a TCP port or
      # holding a password. The image's pg_hba trusts local socket connections.
      - pg-run:/var/run/postgresql
      - ./ops/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./ops/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest-spool:/var/spool/pgbackrest
      - pgbackrest-log:/var/log/pgbackrest
      # Extra databases to create on a cluster that has never been started,
      # currently Umami's and nothing else.
      #
      # The official entrypoint runs these between initdb and the first real
      # start, and only while the data directory has no PG_VERSION in it. Two
      # things about this stack could plausibly have broken that and neither
      # does. Naming an external config file with `command:` does not: the
      # entrypoint still sees `postgres` as its first argument, so it takes the
      # initialisation path, and it hands the same `-c` arguments to the
      # temporary server it runs these scripts against, so that server reads
      # this cluster's real postgresql.conf. Nor does ops/postgres/Dockerfile,
      # which adds one package and touches neither the entrypoint nor this
      # directory.
      #
      # On production, where the cluster already exists, none of this runs ever
      # again. The script says what to do there instead, in one line.
      - ./ops/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` answers as soon as the server accepts connections, which
      # is what `depends_on: service_healthy` above is waiting for. The first
      # start also runs initdb, hence the generous start_period.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beeshive} -d ${POSTGRES_DB:-beeshive}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Scheduled backups to Cloudflare R2, of both halves of what this site
  # cannot regenerate. Shares the data directory and the socket with the
  # database: pgBackRest reads the files itself and only uses the connection to
  # start and stop the backup, so this has to sit on the same host as the
  # cluster it backs up. It runs as the same uid as the server for the same
  # reason — see ops/pgbackrest/entrypoint.sh, which also says why the
  # photographs are snapshotted with restic instead of copied.
  pgbackrest:
    container_name: beeshive-pgbackrest
    # Given a name of its own because restic notices. Every snapshot is stamped
    # with the host that took it, and the repository lock carries the same name;
    # left to Docker that is a fresh random hex id after every rebuild, which
    # turns `restic snapshots` into a list of strangers and, worse, leaves the
    # lock from an interrupted backup looking like it belongs to a machine that
    # might still be running. restic will not clear one of those on its own.
    hostname: beeshive-pgbackrest
    build:
      context: ./ops/pgbackrest
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGBACKREST_STANZA=${PGBACKREST_STANZA:-beeshive}
      # pgBackRest builds its own connection string out of the pg1-* options
      # and pays no attention to PGUSER below, so the role has to be given to
      # it by its own name. See ops/pgbackrest/pgbackrest.conf.
      - PGBACKREST_PG1_USER=${POSTGRES_USER:-beeshive}
      # libpq settings for the connection over the shared socket. The user has
      # to be the one the cluster was initialised with, because that is the
      # only superuser this database has.
      - PGHOST=/var/run/postgresql
      - PGUSER=${POSTGRES_USER:-beeshive}
      - PGDATABASE=${POSTGRES_DB:-beeshive}
      - PGBACKREST_REPO1_S3_BUCKET=${PGBACKREST_S3_BUCKET:-}
      - PGBACKREST_REPO1_S3_ENDPOINT=${PGBACKREST_S3_ENDPOINT:-}
      - PGBACKREST_REPO1_S3_KEY=${PGBACKREST_S3_KEY:-}
      - PGBACKREST_REPO1_S3_KEY_SECRET=${PGBACKREST_S3_KEY_SECRET:-}
      - PGBACKREST_REPO1_CIPHER_PASS=${PGBACKREST_CIPHER_PASS:-}
      # When to run, in the container's own local time. Full once a week,
      # differential on the other days.
      - BACKUP_HOUR=${BACKUP_HOUR:-3}
      - BACKUP_MINUTE=${BACKUP_MINUTE:-15}
      - FULL_BACKUP_DOW=${FULL_BACKUP_DOW:-0}
      # The photographs, into the same bucket pgBackRest is already writing to
      # and under a prefix of its own so the two can never tread on each other:
      # pgBackRest owns /beeshive (repo1-path in ops/pgbackrest/pgbackrest.conf)
      # and restic owns /media. One bucket, one token, one thing to check.
      #
      # Set RESTIC_REPOSITORY in .env to override the whole address, which is
      # what a second bucket or a local test repository would need.
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-s3:https://${PGBACKREST_S3_ENDPOINT:-}/${PGBACKREST_S3_BUCKET:-}/media}
      # The same passphrase as the database backups, and that is a decision
      # rather than a shortcut. Both repositories are encrypted before anything
      # leaves this machine and neither can be read back without its
      # passphrase, so the real question is how many secrets somebody has to
      # keep safe somewhere off this server for the restaurant to survive
      # losing it. Two passphrases means the one nobody wrote down is the one
      # you need at two in the morning. One, on paper, in two places, is the
      # entire recovery plan and it fits on a card.
      - RESTIC_PASSWORD=${PGBACKREST_CIPHER_PASS:-}
      # restic reads S3 credentials under the AWS names, so the same key that
      # pgBackRest is given above is handed over twice under two spellings.
      - AWS_ACCESS_KEY_ID=${PGBACKREST_S3_KEY:-}
      - AWS_SECRET_ACCESS_KEY=${PGBACKREST_S3_KEY_SECRET:-}
      # R2 has no regions to choose between; "auto" is what it answers to, and
      # a real AWS region name ends up in the request signature and is
      # rejected. Same value as repo1-s3-region in ops/pgbackrest/pgbackrest.conf,
      # for the same reason.
      - AWS_DEFAULT_REGION=auto
      # An hour and a quarter after the database, so the two are never reading
      # the disk and filling the uplink at the same moment.
      - MEDIA_BACKUP_HOUR=${MEDIA_BACKUP_HOUR:-4}
      - MEDIA_BACKUP_MINUTE=${MEDIA_BACKUP_MINUTE:-30}
      # How far back the photographs can be recovered from. The reasoning for
      # these three numbers is in ops/pgbackrest/entrypoint.sh, where changing
      # them would be felt.
      - MEDIA_KEEP_WITHIN=${MEDIA_KEEP_WITHIN:-7d}
      - MEDIA_KEEP_DAILY=${MEDIA_KEEP_DAILY:-14}
      - MEDIA_KEEP_WEEKLY=${MEDIA_KEEP_WEEKLY:-8}
      - MEDIA_KEEP_MONTHLY=${MEDIA_KEEP_MONTHLY:-12}
      # Read as a yes-or-no and nothing more. With the bucket configured Payload
      # writes no files to the volume at all, so the scheduler uses this to say
      # once that there is nothing here to snapshot instead of reporting an
      # empty one every night. The two R2 secrets are deliberately not passed
      # in: this container has no business holding the media token as well as
      # the backup one.
      - R2_BUCKET=${R2_BUCKET:-}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-run:/var/run/postgresql
      - ./ops/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest-spool:/var/spool/pgbackrest
      - pgbackrest-log:/var/log/pgbackrest
      # The photographs, READ-ONLY, and the flag is the point rather than a
      # detail. This container's whole job is to copy them somewhere safe, and
      # a backup process holding write access to the thing it is backing up is
      # one bug away from being the disaster it was installed to insure
      # against. Read-only makes that impossible instead of unlikely.
      #
      # ops/restore-media.sh is the one thing that has to write here, and it
      # mounts the volume itself, writably, in a container that exists for the
      # minute the restore takes and is then thrown away.
      #
      # Not /media: the base image already has a /media with the usual empty
      # cdrom and floppy directories in it, and Docker copies the contents of
      # an image directory into a fresh named volume mounted over it.
      - media-uploads:/uploads:ro
      - restic-cache:/var/cache/restic
    restart: unless-stopped

  # Visitor statistics, self-hosted, on stats.debeeshive.nl.
  #
  # A subdomain rather than debeeshive.nl/stats, and that is forced rather than
  # preferred. Umami does have a BASE_PATH setting, but it is read while the
  # image is being BUILT, not when the container starts: the published image is
  # compiled for the root of a host, and there is no runtime switch that moves
  # it. Serving Umami under a path would therefore mean building it from source
  # here and building it again on every upgrade, which is a fork of somebody
  # else's project to save one DNS record. Without BASE_PATH the pages ask for
  # root-absolute `/_next/` and `/api/` URLs, and those are exactly the two
  # prefixes this site already answers on, so under one hostname the proxy would
  # have to guess which application a request belonged to. It cannot, and the
  # failure looks like an Umami that loads without styling and a site whose
  # admin logs itself out. Hence: its own name, its own origin, nothing shared.
  umami:
    container_name: beeshive-umami
    image: docker.umami.is/umami-software/umami:postgresql-latest
    # Published on the host and joined to the proxy network, for the same
    # reason the app is and with the same consequence: Nginx Proxy Manager runs
    # outside this stack, and whichever of the two routes it takes has to exist.
    #
    # In Nginx Proxy Manager, the Proxy Host for stats.debeeshive.nl forwards
    # to either
    #     hostname  beeshive         <- the host machine, not the container
    #     port      3101
    # or
    #     hostname  beeshive-umami   <- the container, over the proxy network
    #     port      3000
    #
    # The two sides of the colon are NOT the same number here, and that is the
    # one place this service departs from the app's convention. The app sets
    # its own PORT from HOST_PORT so the numbers cannot drift; Umami's image
    # listens on 3000 and that is a property of the image rather than something
    # this file gets to choose. So the host-side number is ours to pick, 3101
    # because 3100 is the site, and the container-side 3000 is fixed. Change
    # UMAMI_PORT and the Proxy Host's Forward Port together, and only if you
    # are forwarding to the host rather than to the container.
    ports:
      - "${UMAMI_PORT:-3101}:3000"
    networks:
      - reverse-proxy
      - internal
    # Umami creates its own tables the first time it connects, so it is in the
    # same position the app is: a container that starts before Postgres is
    # accepting connections does not merely retry, it can get its first request
    # wrong. Wait for the healthcheck rather than for the container to exist.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Umami's own database, inside the cluster that is already running, and
      # not a PostgreSQL of its own. One cluster is one thing to run and one
      # thing to back up. pgBackRest copies the whole cluster rather than a
      # database at a time, so the visitor figures are already inside every
      # backup that exists tonight, with no second repository, no second
      # schedule and no second passphrase to lose. A separate PostgreSQL would
      # have bought isolation this site has no use for and a second thing to
      # forget to restore.
      #
      # Same role and same password as the app, because the cluster has exactly
      # one role: initdb creates only POSTGRES_USER, which is also the only
      # superuser and the one pgBackRest connects as.
      #
      # The database itself is created by ops/postgres/initdb on a fresh
      # cluster, and by hand on one that already exists. UMAMI_DB names it in
      # both places.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-beeshive}:${POSTGRES_PASSWORD:-beeshive}@postgres:5432/${UMAMI_DB:-umami}
      # What Umami signs its session cookies with, one random string per
      # installation: `openssl rand -hex 32`.
      #
      # Empty is allowed and is not the same as harmless. Left unset, Umami
      # derives the secret from DATABASE_URL instead, so the signing key of the
      # dashboard becomes a hash of a connection string that is written down in
      # this file, in .env, and in the environment of three containers. Setting
      # it also pins the key: change DATABASE_URL with no APP_SECRET and every
      # session is silently invalidated.
      - APP_SECRET=${UMAMI_APP_SECRET:-}
    restart: unless-stopped

networks:
  # Created and owned by the proxy stack, not by this one. If it does not exist
  # on a host, `docker network create reverse-proxy` before the first up.
  reverse-proxy:
    external: true
  # This stack's own. Postgres is only on here, so nothing outside the stack
  # can reach it — there is no published port on the database on purpose.
  internal:

volumes:
  # The cluster's data directory. This is the one that used to be the single
  # SQLite file, and the one `down -v` destroys: everything the CMS holds lives
  # here now. It is also the reason the backups exist.
  pg-data:
  # The Unix socket directory. Nothing durable, but it has to be a volume
  # rather than a bind mount so the backup container can see the same socket.
  pg-run:
  # pgBackRest's asynchronous archive spool and its logs. The spool is a cache
  # and can be thrown away; losing the logs loses the record of what was backed
  # up when, which is the first thing you want during a restore.
  pgbackrest-spool:
  pgbackrest-log:
  # restic's index cache, so a nightly snapshot does not read the repository
  # index back out of R2 first. Throwing it away costs requests and nothing
  # else.
  restic-cache:
  # Uploaded originals and their generated sizes, for the case where R2 is not
  # configured. With a bucket set up this volume stays empty. Either way the
  # backup container snapshots it nightly, so `down -v` is no longer the end of
  # the photographs — see docs/backups.md.
  media-uploads:
