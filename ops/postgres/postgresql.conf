# PostgreSQL server configuration for De Bee's Hive.
#
# This file replaces the one initdb generates: docker-compose starts the server
# with `-c config_file=/etc/postgresql/postgresql.conf`, so everything the
# cluster needs has to be here, not only the additions. Editing it takes a
# `docker compose restart postgres`; the archiving settings below cannot be
# changed with a reload.
#
# postgresql.auto.conf in the data directory is still read afterwards, so
# anything set with ALTER SYSTEM keeps overriding this file.

listen_addresses = '*'          # only the stack's internal network can reach it
max_connections = 100
shared_buffers = 256MB          # small site, small VPS; raise with the host
dynamic_shared_memory_type = posix

timezone = 'Europe/Amsterdam'
log_timezone = 'Europe/Amsterdam'
datestyle = 'iso, mdy'
lc_messages = 'C'

# Logging. `docker compose logs postgres` is the only place anyone will look,
# so everything goes to stderr rather than to a file inside the container.
logging_collector = off
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '

# ---------------------------------------------------------------------------
# Write-ahead log archiving
#
# This is what makes point-in-time recovery possible: the base backups
# pgBackRest takes are only restorable to the moment they were taken unless
# every WAL segment written since is archived as well.
#
# `archive_mode = on` is not a suggestion to Postgres. A segment that fails to
# archive is retried forever and is *not* recycled in the meantime, so a broken
# archive_command does not lose data — it fills pg_wal instead, and when the
# volume is full the server stops accepting writes and will not restart. The
# site goes down some days after the actual fault, which is what makes this
# worth watching for.
#
# How to notice, in the order you should try them:
#
#     docker compose logs postgres | grep -i "archive command failed"
#     docker compose exec postgres psql -U beeshive -c \
#       "SELECT archived_count, last_failed_wal, last_failed_time FROM pg_stat_archiver;"
#     docker compose exec postgres du -sh /var/lib/postgresql/data/pg_wal
#
# A non-zero `failed_count` with a recent `last_failed_time` is the alarm. The
# usual causes are an expired R2 token, a bucket that was renamed, and a
# missing PGBACKREST_CIPHER_PASS.
# ---------------------------------------------------------------------------
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=beeshive archive-push %p'
# Archiving is asynchronous (see archive-async in pgbackrest.conf), so this
# command returns as soon as the segment is queued in the spool directory and a
# slow upload to R2 cannot stall the server.
archive_timeout = 300           # close a segment every 5 minutes even when idle,
                                # which bounds how much a restore can lose
max_wal_senders = 3
max_wal_size = 1GB
min_wal_size = 80MB
