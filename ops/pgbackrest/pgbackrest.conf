# pgBackRest, backing De Bee's Hive's database up to Cloudflare R2.
#
# This file is in the repository, so it holds no secrets. The bucket name, the
# endpoint, the two keys and the encryption passphrase all come from the
# environment instead: pgBackRest reads PGBACKREST_<OPTION_IN_CAPITALS> for
# every option it has, and the environment takes precedence over this file.
# docker-compose passes them to both the database container (which archives
# WAL) and the backup container (which takes the backups).
#
# The values below are therefore either safe defaults or placeholders that the
# environment is expected to replace. See ops/README.md.

[global]
# R2 speaks the S3 API, with the same two deviations the website's upload
# storage has to be told about:
#   - the region is always "auto"; there is no region to choose, and any real
#     AWS region name ends up in the request signature and is rejected;
#   - path-style URIs, because https://<bucket>.<account>.r2.cloudflarestorage.com
#     does not resolve. The bucket belongs in the path.
repo1-type=s3
repo1-s3-bucket=beeshive-backups
repo1-s3-endpoint=CHANGE-ME.r2.cloudflarestorage.com
repo1-s3-region=auto
repo1-s3-uri-style=path
# Everything is written under this prefix inside the bucket, so the same bucket
# can hold something else later without the two becoming impossible to tell
# apart.
repo1-path=/beeshive

# Encrypted before it leaves the machine. The passphrase is only in the
# environment (PGBACKREST_CIPHER_PASS) and is never written here: with it, a
# leaked bucket is a pile of noise; without it, the backups are unreadable and
# there is no recovery from that. Keep a copy somewhere a fire cannot reach it.
repo1-cipher-type=aes-256-cbc

# Four full backups kept, each with the differentials and WAL taken after it.
# With a full every Sunday that is roughly a month of history, which is what
# the bucket is being paid for.
repo1-retention-full=4

# Asynchronous archiving. archive_command hands the segment to the spool
# directory and returns; a separate process uploads it. Without this a slow
# upload blocks the checkpoint that triggered it, and a network hiccup at R2
# turns into write latency on the website. archive-push-queue-max is the point
# at which pgBackRest starts dropping segments rather than letting the spool
# fill the disk — a deliberate choice to lose recoverability instead of losing
# the server, and it is loud about it in the log.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=2GiB

compress-type=zst
compress-level=3
process-max=2
start-fast=y

log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[beeshive]
# Both containers see the same cluster: the data directory and the socket
# directory are shared volumes. pgBackRest reads the files directly and uses
# the connection only to start and stop the backup.
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-port=5432
# Which role to connect as, and it has to be said out loud.
#
# pgBackRest otherwise connects as the operating system user it is running as,
# which in both containers is `postgres` — and this cluster has no such role.
# initdb creates exactly one superuser, named by POSTGRES_USER, and the
# official image never adds a second. The failure is a confusing one, because
# pgBackRest reports it as a missing *cluster* rather than a missing *role*:
#
#     WARN: unable to check pg1: [DbConnectError] ... FATAL: role "postgres" does not exist
#     ERROR: [056]: unable to find primary cluster - cannot proceed
#           HINT: are all available clusters in recovery?
#
# and stanza-create, backup and check all stop there. docker-compose overrides
# this with PGBACKREST_PG1_USER built from POSTGRES_USER, so changing the
# database user in one place is still enough.
pg1-user=beeshive
pg1-database=postgres
